<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="theme-color" content="#fff6ec">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff6ec;
    --ink: #2b2522;
    --muted: #8a7d74;
    --card: #ffffff;
    --line: #efe1d2;
    --blue: #3f82e6;
    --blue-soft: #e4eeff;
    --pink: #ee5f7c;
    --pink-soft: #ffe4ea;
    --green: #26a865;
    --amber: #e59a1f;
    --me: var(--ink);
    --font: "Fredoka", ui-rounded, system-ui, -apple-system, sans-serif;
  }
  body.me-blue { --me: var(--blue); }
  body.me-pink { --me: var(--pink); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--font); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  img { height: auto; }

  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #f4ece2; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }
  #who, #lobby, #results {
    background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px + var(--reserve, 0px));
  }
  .a2hs {
    display: flex; align-items: center; gap: 10px; margin: 0 0 12px; padding: 10px 10px 10px 14px; border-radius: 16px;
    background: #fff3c4; color: #6b4a00; font-weight: 500; font-size: 15px; line-height: 1.3;
  }
  .a2hs[hidden], .update[hidden] { display: none; }
  .update {
    display: block; width: 100%; margin: 0 0 12px; padding: 12px 14px; border-radius: 16px; text-align: left;
    background: var(--me); color: #fff; font-weight: 600; font-size: 16px;
  }
  .a2hs span { flex: 1; }
  .a2hs button { flex: none; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; color: #6b4a00; }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ---------- who */
  .who-wrap { max-width: 420px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: 0.2px; }
  .who-wrap .brand { font-size: 18px; color: var(--muted); text-align: center; }
  .who-wrap h1 { margin: 0 0 10px; font-weight: 700; font-size: 34px; text-align: center; }
  .who-btn {
    display: flex; align-items: center; gap: 16px; width: 100%; padding: 18px 22px;
    border-radius: 24px; background: var(--card); box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(43,37,34,0.07);
    font-weight: 600; font-size: 26px; text-align: left;
  }
  .who-btn img { width: 84px; }
  .who-btn.blue { border: 3px solid var(--blue); }
  .who-btn.pink { border: 3px solid var(--pink); }
  .who-btn:active { transform: scale(0.98); }
  .who-wrap .hint { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 15px; font-weight: 500; }

  /* ---------- lobby */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .me-chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    background: var(--card); box-shadow: 0 1px 0 var(--line); font-weight: 600; font-size: 16px;
  }
  .me-chip .dot, .peer .dot, .opp .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .me-chip.blue .dot { background: var(--blue); }
  .me-chip.pink .dot { background: var(--pink); }
  .me-chip.armed { background: var(--ink); color: #fff; }
  .peer {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px;
    background: var(--card); font-weight: 600; font-size: 17px; box-shadow: 0 1px 0 var(--line);
  }
  .peer.here .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(38,168,101,0.18); }
  .peer.busy .dot { background: var(--amber); box-shadow: 0 0 0 4px rgba(229,154,31,0.18); }
  .peer.away { color: var(--muted); }
  .tally { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-weight: 600; font-size: 15px; flex-wrap: wrap; }
  .tally .tl { color: var(--muted); margin-right: 2px; }
  .tn { padding: 5px 12px; border-radius: 999px; }
  .tn.blue { background: var(--blue-soft); color: #2459a8; }
  .tn.pink { background: var(--pink-soft); color: #b73252; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 0 0 12px;
    border-radius: 22px; background: var(--card); overflow: hidden;
    box-shadow: 0 2px 0 var(--line), 0 10px 22px rgba(43,37,34,0.06);
  }
  .card:active { transform: scale(0.98); }
  .card .art { background: var(--tint); aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; }
  .card .art img { width: 100%; height: 100%; object-fit: contain; }
  .card .name { padding: 10px 12px 0; font-weight: 700; font-size: 18px; line-height: 1.15; }
  .card .blurb { padding: 3px 12px 0; color: var(--muted); font-weight: 500; font-size: 13.5px; line-height: 1.3; min-height: 2.6em; }
  .card .best-label { padding: 8px 12px 4px; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
  .bests { display: grid; gap: 4px; padding: 0 12px; }
  .best { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 14px; padding: 4px 10px; border-radius: 10px; }
  .best b { font-weight: 700; }
  .best.blue { background: var(--blue-soft); color: #2459a8; }
  .best.pink { background: var(--pink-soft); color: #b73252; }
  .best.lead { box-shadow: inset 0 0 0 2px currentColor; }

  .card.featured { grid-column: 1 / -1; }
  .card.featured .art { aspect-ratio: 2 / 1; }
  .card.featured .name { font-size: 23px; padding-top: 12px; }
  .card.featured .blurb { min-height: 0; font-size: 15px; }
  .card.featured .bests { grid-template-columns: 1fr 1fr; }
  .more { grid-column: 1 / -1; margin: 8px 4px -2px; color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; }

  /* ---------- buttons, overlays */
  .btn {
    display: block; width: 100%; height: 56px; border-radius: 18px; background: var(--card);
    font-weight: 600; font-size: 19px; box-shadow: inset 0 0 0 2px var(--line);
  }
  .btn.primary { background: var(--me); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .btn.quiet { box-shadow: none; background: transparent; color: var(--muted); height: 48px; }
  .btn:disabled { opacity: 0.4; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(43,37,34,0.38); opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .panel {
    width: 100%; max-width: 520px; background: var(--bg); border-radius: 28px 28px 0 0;
    padding: 22px 18px calc(env(safe-area-inset-bottom) + 18px + var(--reserve, 0px)); display: flex; flex-direction: column; gap: 10px;
    transform: translateY(30px); transition: transform 0.22s cubic-bezier(.2,.9,.3,1.2);
  }
  .overlay.on .panel { transform: none; }
  .panel-title { font-weight: 700; font-size: 25px; text-align: center; }
  .panel-sub { color: var(--muted); font-weight: 500; font-size: 16px; text-align: center; margin: -4px 0 8px; }
  .note { color: var(--muted); font-weight: 500; font-size: 15px; text-align: center; min-height: 0; }
  .note:empty { display: none; }
  .spinner { width: 34px; height: 34px; margin: 6px auto 10px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--me); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); z-index: 40;
    transform: translate(-50%, -140%); transition: transform 0.25s; padding: 10px 18px; border-radius: 999px;
    background: var(--ink); color: #fff; font-weight: 600; font-size: 16px; white-space: nowrap;
  }
  .toast.on { transform: translate(-50%, 0); }
  .conn {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12px + var(--reserve, 0px)); z-index: 30; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; background: rgba(43,37,34,0.8); color: #fff; font-weight: 600; font-size: 14px;
    display: none;
  }
  .conn.on { display: block; }

  /* ---------- in-game HUD */
  #play { pointer-events: none; }
  .hud {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 6px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: 0 12px;
  }
  .quit {
    pointer-events: auto; justify-self: start; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px;
    background: rgba(255,255,255,0.75); color: var(--ink); font-weight: 600; font-size: 16px;
    display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 0 rgba(0,0,0,0.08);
  }
  .quit .sure { display: none; }
  .quit.armed { background: var(--ink); color: #fff; }
  .quit.armed .x { display: none; }
  .quit.armed .sure { display: inline; }
  .mid { text-align: center; }
  .my-score, .countdown {
    font-weight: 700; color: #fff; line-height: 1;
    text-shadow: 0 3px 0 var(--ink), 0 -2px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink),
      2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 8px 14px rgba(0,0,0,0.18);
  }
  .my-score { font-size: 60px; }
  .my-score.bump { animation: bump 0.22s ease-out; }
  @keyframes bump { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .target {
    display: none; margin-top: 4px; padding: 4px 12px; border-radius: 999px; background: rgba(43,37,34,0.78);
    color: #fff; font-weight: 600; font-size: 15px;
  }
  .target.on { display: inline-block; }
  .opp {
    justify-self: end; display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.82); font-weight: 600; font-size: 16px; box-shadow: 0 1px 0 rgba(0,0,0,0.08);
  }
  .opp b { font-weight: 700; font-size: 20px; min-width: 1ch; }
  .opp.blue .dot { background: var(--blue); }
  .opp.pink .dot { background: var(--pink); }
  .opp.solo .dot { display: none; }
  .opp .tag { font-size: 13px; color: var(--muted); }
  .opp .tag:empty { display: none; }
  .opp.done { opacity: 0.85; }
  .countdown { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-size: 120px; opacity: 0; }
  .countdown.pop { animation: pop 0.7s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(1.7); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(0.9); } }
  .out {
    position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px + var(--reserve, 0px)); max-width: 420px; margin: 0 auto;
    padding: 16px 18px; border-radius: 22px; background: rgba(255,255,255,0.94); text-align: center;
    box-shadow: 0 10px 30px rgba(43,37,34,0.18); transform: translateY(160%); transition: transform 0.3s cubic-bezier(.2,.9,.3,1.1);
  }
  .out.on { transform: none; }
  #out-me { font-weight: 700; font-size: 22px; }
  #out-opp { margin-top: 4px; color: var(--muted); font-weight: 600; font-size: 17px; }

  /* lobby sideways: featured games side by side, the rest in one row */
  @media (orientation: landscape) and (min-width: 600px) {
    .wrap { max-width: 900px; }
    .grid { grid-template-columns: repeat(4, 1fr); }
    .card.featured { grid-column: span 2; }
    .card.featured .art { aspect-ratio: 2.4 / 1; }
    #who, #lobby, #results { padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  }

  /* ---------- landscape games */
  .rotate {
    position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center;
    background: rgba(43,37,34,0.82); color: #fff;
  }
  .rotate.on { display: flex; }
  .rotate-card { text-align: center; }
  .rotate-phone {
    width: 46px; height: 80px; margin: 0 auto 18px; border: 4px solid #fff; border-radius: 10px;
    animation: turn 1.6s ease-in-out infinite;
  }
  @keyframes turn { 0%, 20% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
  .rotate-text { font-weight: 700; font-size: 22px; }
  @media (orientation: landscape) {
    .hud { padding: 0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); top: 6px; }
    .my-score { font-size: 40px; }
    .quit, .opp { height: 36px; }
    .countdown { top: 30%; font-size: 96px; }
  }

  /* ---------- results */
  .res { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .res-game { text-align: center; color: var(--muted); font-weight: 600; font-size: 17px; }
  .res-title { margin: 0 0 6px; text-align: center; font-weight: 700; font-size: 40px; line-height: 1.1; }
  #results[data-outcome="win"] .res-title { color: var(--me); }
  .res-cols { display: flex; gap: 12px; }
  .res-col {
    flex: 1; padding: 16px 10px 14px; border-radius: 24px; background: var(--card); text-align: center;
    box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(43,37,34,0.06); border-top: 6px solid var(--muted);
  }
  .res-col.blue { border-top-color: var(--blue); }
  .res-col.pink { border-top-color: var(--pink); }
  .res-col .n { font-weight: 600; font-size: 18px; color: var(--muted); }
  .res-col .s { font-weight: 700; font-size: 56px; line-height: 1.1; }
  .res-col .badge { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 999px; background: #fff3c4; color: #8a5b00; font-weight: 600; font-size: 13px; }
  .res-col .badge[hidden] { display: none; }
  .res-why { margin: -8px 0 4px; text-align: center; color: var(--muted); font-weight: 600; font-size: 16px; }
  .res-why:empty { display: none; }
  .res-best { text-align: center; color: var(--muted); font-weight: 600; font-size: 16px; }
  .res-best:empty { display: none; }
  #res-tally { justify-content: center; margin: 2px 0 8px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="who" class="screen">
  <div class="who-wrap">
    <div class="brand">Pocket Arcade</div>
    <h1>Who's playing?</h1>
    <button class="who-btn blue" data-name="Jacob"><img alt=""><span>Jacob</span></button>
    <button class="who-btn pink" data-name="Laura"><img alt=""><span>Laura</span></button>
    <p class="hint">Each phone picks once.</p>
  </div>
</section>

<section id="lobby" class="screen">
  <div class="wrap">
    <header class="top">
      <div class="brand">Pocket Arcade</div>
      <button id="me-chip" class="me-chip"><span class="dot"></span><span id="me-name"></span></button>
    </header>
    <button id="update" class="update" hidden>A new version is ready. Tap to update.</button>
    <div id="a2hs" class="a2hs" hidden><span>For full screen, add this page to your Home Screen: tap Share, then Add to Home Screen.</span><button id="a2hs-close" aria-label="Hide">✕</button></div>
    <div id="peer" class="peer away"><span class="dot"></span><span class="txt"></span></div>
    <div id="tally" class="tally"></div>
    <div id="games" class="grid"></div>
  </div>
</section>

<section id="play" class="screen">
  <div class="hud">
    <button id="quit" class="quit" aria-label="Quit"><span class="x">✕</span><span class="sure">Tap again to quit</span></button>
    <div class="mid"><div id="my-score" class="my-score">0</div><div id="target" class="target"></div></div>
    <div id="opp" class="opp"><span class="dot"></span><span id="opp-name"></span><b id="opp-score">0</b><span id="opp-tag" class="tag"></span></div>
  </div>
  <div id="countdown" class="countdown"></div>
  <div id="out" class="out"><div id="out-me"></div><div id="out-opp"></div></div>
</section>

<section id="results" class="screen">
  <div class="res">
    <div id="res-game" class="res-game"></div>
    <h1 id="res-title" class="res-title"></h1>
    <div id="res-why" class="res-why"></div>
    <div class="res-cols">
      <div id="res-me" class="res-col"><div class="n"></div><div class="s"></div><div class="badge" hidden>New best</div></div>
      <div id="res-opp" class="res-col"><div class="n"></div><div class="s"></div><div class="badge" hidden>New best</div></div>
    </div>
    <div id="res-best" class="res-best"></div>
    <div id="res-tally" class="tally"></div>
    <button id="btn-again" class="btn primary">Rematch</button>
    <button id="btn-lobby" class="btn">All games</button>
  </div>
</section>

<div id="sheet" class="overlay"><div class="panel">
  <div id="sheet-title" class="panel-title"></div>
  <div id="sheet-blurb" class="panel-sub"></div>
  <button id="btn-duo" class="btn primary"></button>
  <div id="duo-note" class="note"></div>
  <button id="btn-solo" class="btn">Play solo</button>
  <button id="btn-sheet-close" class="btn quiet">Cancel</button>
</div></div>

<div id="waiting" class="overlay"><div class="panel">
  <div id="wait-text" class="panel-title"></div>
  <div id="wait-sub" class="panel-sub"></div>
  <div class="spinner"></div>
  <button id="btn-wait-cancel" class="btn">Cancel</button>
</div></div>

<div id="invite" class="overlay"><div class="panel">
  <div id="invite-text" class="panel-title"></div>
  <button id="btn-accept" class="btn primary">Play</button>
  <button id="btn-decline" class="btn">Not now</button>
</div></div>

<div id="rotate" class="rotate"><div class="rotate-card"><div class="rotate-phone"></div><div class="rotate-text">Turn your phone sideways</div></div></div>
<div id="toast" class="toast"></div>
<div id="conn" class="conn">Reconnecting…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.ARCADE_STYLE = "toon"; window.ARCADE_VERSION = "20261112114248";</script>
<script src="js/config.js?v=20261112114248"></script>
<script src="js/engine.js?v=20261112114248"></script>
<script src="js/games/blocks.js?v=20261112114248"></script>
<script src="js/games/critters.js?v=20261112114248"></script>
<script src="js/games/plane.js?v=20261112114248"></script>
<script src="js/games/flip.js?v=20261112114248"></script>
<script src="js/games/stack.js?v=20261112114248"></script>
<script src="js/games/keepup.js?v=20261112114248"></script>
<script src="js/net.js?v=20261112114248"></script>
<script src="js/shell.js?v=20261112114248"></script>
</body>
</html>
